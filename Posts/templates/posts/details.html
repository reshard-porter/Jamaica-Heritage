{% extends 'posts/layout.html' %}

{% block content %}
<h2 class="center-align"><strong>{{ post.title }}</strong></h2>
<div class="card">
    <div class="card-content">
        {{ post.body|linebreaks }}
    </div>
    <div class="card-action">
        {{ post.created_at }}
    </div>
</div>
<a href="{% url 'posts:index' %}" class="btn">Go Back</a>
{% endblock %}
