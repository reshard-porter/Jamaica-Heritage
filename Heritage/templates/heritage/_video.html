<figure class="video">
    <button type="button" class="video-frame" data-video-id="{{ video.id }}" aria-label="Play video: {{ video.title }}">
        <img src="{{ video.thumb }}" alt="" loading="lazy" decoding="async" onerror="this.remove()">
        <span class="play" aria-hidden="true">
            <svg viewBox="0 0 68 48"><path d="M66.5 7.7a8.5 8.5 0 0 0-6-6C55.2.3 34 .3 34 .3s-21.2 0-26.5 1.4a8.5 8.5 0 0 0-6 6C.2 13 .2 24 .2 24s0 11 1.3 16.3a8.5 8.5 0 0 0 6 6C12.8 47.7 34 47.7 34 47.7s21.2 0 26.5-1.4a8.5 8.5 0 0 0 6-6C67.8 35 67.8 24 67.8 24s0-11-1.3-16.3z" fill="#111" fill-opacity=".85"/><path d="M45 24 27 14v20z" fill="#FED100"/></svg>
        </span>
    </button>
    <figcaption>
        <strong>{{ video.title }}</strong>
        <span class="credit">{{ video.publisher }} · <a href="{{ video.watch_url }}" target="_blank" rel="noopener">Watch on YouTube</a></span>
    </figcaption>
</figure>
